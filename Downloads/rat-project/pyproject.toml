[tool.poetry]
name = "rat-project"
version = "1.0.0"
description = "Remote Administration Tool - Projet Final"
authors = ["Votre Groupe"]
readme = "README.md"
packages = [
    { include = "common" },
    { include = "client" },
    { include = "server" },
]

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
cryptography = ">=41.0.0"
pyautogui = ">=0.9.54"
pillow = ">=10.0.0"
psutil = ">=5.9.0"
opencv-python = ">=4.8.0"
sounddevice = "^0.5.6"
numpy = "^2.5.2"
requests = ">=2.31.0"
pynput = "^1.8.2"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4.0"
pytest-cov = ">=4.1.0"
pre-commit = ">=3.5.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]